spring:

  application:
    name: shop

  datasource:
    url: jdbc:h2:mem:shop;MODE=MYSQL

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
